<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>네컷 사진 받기</title>
<style>
:root { --purple: #6b3da8; --deep: #3a2a55; --muted: #6a5a85; --yellow: #ffd133; --line: #e6dcf5; }
* { box-sizing: border-box; }
html { background: #f6f0ff; }
body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; background: linear-gradient(160deg, #fff0f7, #f3ecff 55%, #fff8dc); background-attachment: fixed; color: var(--deep); text-align: center; padding: 22px 16px 48px; min-height: 100vh; }
h1 { font-size: 24px; margin: 6px 0 4px; }
p { margin: 8px 0; line-height: 1.55; }
.card { max-width: 460px; margin: 18px auto 0; background: rgba(255,255,255,.7); border-radius: 20px; padding: 16px 14px 18px; box-shadow: 0 10px 30px rgba(110,60,170,.12); }
.card h2 { font-size: 18px; margin: 2px 0 10px; }
.media { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; border-radius: 10px; box-shadow: 0 8px 24px rgba(110,60,170,.22); -webkit-touch-callout: default; background: #fff; }
.btn { display: block; width: 100%; max-width: 360px; margin: 14px auto 0; padding: 16px; border: 0; border-radius: 999px; background: var(--purple); color: #fff; font: inherit; font-size: 19px; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn.sub { background: var(--yellow); color: #3a2a00; }
.btn:disabled { opacity: .6; }
.msg { min-height: 1.4em; font-size: 15px; color: var(--purple); font-weight: 600; }
.tip { font-size: 15px; color: var(--muted); }
.small { font-size: 13px; color: #8a7aa5; margin-top: 24px; }
.err { max-width: 420px; margin: 40px auto; }
.load { color: var(--muted); font-size: 15px; padding: 30px 0; }
</style>
</head>
<body>
<h1>📸 사진이 도착했어요!</h1>
<p id="title" hidden></p>
<div id="app"><p class="load">불러오는 중…</p></div>
<p class="small" id="foot"></p>
<script>
(function () {
  "use strict";
  var HOST = "https://litter.catbox.moe/";
  var NAME = /^[A-Za-z0-9_-]{3,40}\.(jpg|jpeg|png|gif)$/;
  var q = {};
  (location.hash.replace(/^#/, "") || location.search.replace(/^\?/, "")).split("&").forEach(function (kv) {
    var i = kv.indexOf("="); if (i < 1) return;
    try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); } catch (e) {}
  });
  var app = document.getElementById("app");
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isInApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  if (q.t) { var t = document.getElementById("title"); t.textContent = q.t; t.hidden = false; }
  var exp = parseInt(q.x, 10);
  var foot = document.getElementById("foot");
  if (exp > 0) {
    var left = exp * 1000 - Date.now();
    if (left <= 0) { showGone(); return; }
    var h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
    foot.textContent = "이 사진은 " + (h > 0 ? h + "시간 " : "") + m + "분 뒤 자동으로 지워져요. 지금 꼭 저장해 주세요.";
  } else foot.textContent = "이 사진은 잠시 뒤 자동으로 지워져요. 지금 꼭 저장해 주세요.";

  var items = [];
  if (q.p && NAME.test(q.p)) items.push({ url: HOST + q.p, kind: "photo", name: "photobooth_" + q.p.replace(/\.[^.]+$/, "") + "." + q.p.split(".").pop(), label: "원본 사진 저장하기", h: "네컷 사진" });
  if (q.g && NAME.test(q.g)) items.push({ url: HOST + q.g, kind: "gif", name: "photobooth_" + q.g.replace(/\.[^.]+$/, "") + ".gif", label: "움직이는 사진(GIF) 저장하기", h: "움직이는 사진 (GIF)" });
  if (!items.length) { showGone(); return; }

  app.innerHTML = "";
  if (isInApp) {
    var w = el("p", "tip"); w.innerHTML = "⚠️ 카카오톡·인스타 안에서 열렸다면 저장이 안 될 수 있어요.<br>오른쪽 위 <b>⋮ / 공유</b> → <b>다른 브라우저로 열기</b>를 눌러 주세요.";
    app.appendChild(w);
  }
  items.forEach(function (it, i) {
    var card = el("div", "card");
    card.appendChild(el("h2", null, it.h));
    var img = el("img", "media"); img.alt = it.h; img.src = it.url; img.decoding = "async";
    img.onerror = function () { card.innerHTML = ""; card.appendChild(el("h2", null, it.h)); card.appendChild(el("p", "tip", "사진을 불러오지 못했어요. 시간이 지나 지워졌거나 인터넷이 잠깐 끊겼어요. 잠시 뒤 새로고침해 주세요.")); };
    card.appendChild(img);
    var b = el("button", "btn" + (i ? " sub" : ""), it.label); b.type = "button";
    var msg = el("p", "msg");
    b.addEventListener("click", function () { save(it, b, msg); });
    card.appendChild(b); card.appendChild(msg);
    app.appendChild(card);
  });
  var tip = el("p", "tip");
  tip.innerHTML = isIOS ? "버튼이 안 되면 사진을 <b>길게 눌러</b> ‘사진 앱에 저장’을 눌러 주세요."
    : isAndroid ? "갤럭시: 버튼을 누르면 <b>다운로드</b>에 저장돼요 (갤러리 앱에서 보여요).<br>버튼이 안 되면 사진을 <b>길게 눌러</b> ‘이미지 다운로드’를 눌러 주세요."
    : "버튼이 안 되면 사진을 길게 누르거나 오른쪽 클릭해서 저장해 주세요.";
  tip.style.marginTop = "18px";
  app.appendChild(tip);

  /* 미리 받아 둠: 아이폰은 버튼을 누른 그 순간에 공유 창을 열어야 해서 */
  items.forEach(function (it) {
    it.pre = fetch(it.url, { mode: "cors", credentials: "omit" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function (b) { it.blob = b; return b; }, function () { it.failed = true; return null; });
  });
  function save(it, btn, msg) {
    if (it.blob) { deliver(it, it.blob, msg); return; }
    if (it.failed) { fallback(it, msg); return; }
    btn.disabled = true; msg.textContent = "준비 중…";
    it.pre.then(function (b) { btn.disabled = false; if (b) deliver(it, b, msg); else fallback(it, msg); });
  }
  function deliver(it, blob, msg) {
    var type = it.kind === "gif" ? "image/gif" : (blob.type && blob.type.indexOf("image/") === 0 ? blob.type : "image/jpeg");
    var typed = new Blob([blob], { type: type }), file = null;
    try { file = new File([typed], it.name, { type: type }); } catch (e) {}
    /* 아이폰: 공유 창 → '이미지 저장'이면 사진 앱에 바로 들어감 */
    if (isIOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () { msg.textContent = "✅ 저장했어요!"; }, function (e) {
        if (e && e.name === "AbortError") { msg.textContent = ""; return; }
        msg.textContent = "사진을 길게 눌러 ‘사진 앱에 저장’을 눌러 주세요";
      });
      return;
    }
    download(typed, it.name);
    msg.textContent = isAndroid ? "✅ 다운로드에 저장했어요 (갤러리 앱에서 보여요)" : "✅ 저장했어요";
  }
  function fallback(it, msg) {
    /* 바로 받기가 막힌 경우: 사진만 따로 열어서 길게 눌러 저장 */
    msg.textContent = "사진이 열리면 길게 눌러 " + (isIOS ? "‘사진 앱에 저장’을" : "‘이미지 다운로드’를") + " 눌러 주세요";
    var a = document.createElement("a"); a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function download(blob, name) {
    var u = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = u; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  }
  function showGone() {
    app.innerHTML = "";
    var d = el("div", "err");
    d.appendChild(el("h2", null, "사진을 찾을 수 없어요"));
    d.appendChild(el("p", "tip", "보관 시간이 지나 자동으로 지워졌거나 주소가 잘못되었어요. 포토부스 담당자에게 말씀해 주세요."));
    app.appendChild(d); foot.textContent = "";
  }
})();
</script>
</body>
</html>
